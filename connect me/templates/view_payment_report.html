{%include 'worker_header.html'%}
<br><br><br><br><br>
<div class="container" style="max-width: 900px; margin: 20px auto; background: #fffaf0; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);">
    <h1 style="text-align: center; font-family: 'Arial', sans-serif; color: #f57c00; margin-bottom: 20px;">Payment Report</h1>

    <table style="width: 100%; border-collapse: collapse; font-family: 'Arial', sans-serif; text-align: left; border: 1px solid #ddd; margin-top: 20px;">
        <thead>
            <tr style="background-color: #f57c00; color: white;">
                <th style="padding: 12px;">Amount</th>
                <th style="padding: 12px;">Date & Time</th>
                <th style="padding: 12px;">Status</th>
            </tr>
        </thead>
        <tbody>
            {%for i in data['view']%}
            <tr style="background-color: #fffaf0; border-bottom: 1px solid #ddd;">
                <td style="padding: 10px; color: #333;">{{i['total_amount']}}</td>
                <td style="padding: 10px; color: #333;">{{i['date_time']}}</td>
                <td style="padding: 10px; color: #333;">{{i['pay_status']}}</td>
            </tr>
            {%endfor%}
        </tbody>
    </table>
</div>
<br><br><br><br><br>
{%include 'footer.html'%}
