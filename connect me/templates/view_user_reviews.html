<div class="container" style="max-width: 800px; margin: 0 auto; background: #fffaf0; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);">
    <h1 style="text-align: center; font-family: 'Helvetica', sans-serif; color: #f57c00; margin-bottom: 20px;">Reviews</h1>
    
    <table style="width: 100%; border-collapse: collapse; margin-top: 20px; font-family: 'Helvetica', sans-serif; border: 1px solid #ddd;">
        <thead>
            <tr style="background-color: #f57c00; color: white; text-align: left;">
                <th style="padding: 12px;">Review</th>
                <th style="padding: 12px;">Rating</th>
            </tr>
        </thead>
        <tbody>
            {%for i in data['view']%}
            <tr style="background-color: #fffaf0; border: 1px solid #ddd;">
                <td style="padding: 10px; color: #333;">{{i['review']}}</td>
                <td style="padding: 10px; color: #333;">{{i['rating']}}</td>
            </tr>
            {%endfor%}
        </tbody>
    </table>
</div>
