<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    /* General body styling */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      background: url('/static/back.jpg');
      background-size: 130%;
      flex-direction: column;
      min-height: 100vh;
      color: #333; /* Dark text */
    }

    /* Center container */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Profile picture styling */
    .profile-pic {
      margin-bottom: 15px;
    }

    .profile-pic img {
      width: 60px; /* Reduced size */
      height: 60px;
      border-radius: 50%;
      border: 3px solid #ff6600; /* Orange border */
      object-fit: cover;
    }

    /* Heading styling */
    h1 {
      color: #ff6600; /* Orange heading */
      margin-bottom: 20px;
    }

    /* Form styling */
    form {
      width: 100%;
      max-width: 400px;
      background: #fff; /* White background */
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #333; /* Dark text for labels */
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #f9f9f9; /* Light background for input fields */
    }

    button {
      width: 100%;
      padding: 10px;
      background: #ff6600; /* Orange button */
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #e05500; /* Darker orange on hover */
    }

    /* Forgot password link */
    .forgot-password {
      text-align: center;
      margin-top: 10px;
    }

    .forgot-password a {
      color: #ff6600;
      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    /* Footer styling */
    footer {
      background-color: #fff; /* White footer */
      text-align: center;
      padding: 10px;
      position: relative;
      bottom: 0;
      width: 100%;
      color: #666; /* Grey text */
      font-size: 14px;
      border-top: 2px solid #ff6600; /* Orange top border for footer */
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-pic">
      <img src="static/assets/img/profile_icon_image.png" alt="Profile Picture">
    </div>
    <h1>login</h1>
    <form method="post">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" value="username" name="username" placeholder="Enter your username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" value="password" name="password" placeholder="Enter your password">
      </div>
      <button type="submit" name="login" class="login-button">Login</button>
      <div class="forgot-password">
        <a href="forgot_password.html">Forgot Password?</a>
      </div>
    </form>
  </div>
